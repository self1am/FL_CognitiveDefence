# A minimal Ray cluster configuration file for local or cloud setup
# For more details, see: https://docs.ray.io/en/latest/cluster/vms/user-guides/configuration.html

# The name of your Ray cluster
cluster_name: default

# The provider configuration. This example is for a local cluster.
provider:
  type: local
  head_ip: 127.0.0.1

# The head node configuration
head_node:
  resources:
    CPU: 8
    memory: 64GB

# Worker node configuration
worker_nodes:
  - resources:
      CPU: 8
      memory: 64GB

# Number of worker nodes to launch
min_workers: 1
max_workers: 4

# File mounts (optional)
file_mounts: {}

# Python environment settings
setup_commands:
  - echo "Setting up Python environment"
  - pip install -r requirements.txt

# Ray start commands
head_start_ray_commands:
  - ray start --head --port=6379

worker_start_ray_commands:
  - ray start --address=$RAY_HEAD_IP:6379