# Test config for multiprocessing fix
# Small scale test: 5 clients, 5 rounds
# Tests if server and clients can run together in one terminal

experiment:
  experiment_name: "test_multiprocess_fix"
  seed: 42
  num_rounds: 5
  min_clients: 3
  min_available_clients: 3
  server_address: "0.0.0.0:8080"

defence:
  strategy: "cognitive_defence"
  anomaly_threshold: 0.65
  reputation_decay: 0.75
  history_size: 50

attacks:
  # 2 clients with label flip
  - enabled: true
    attack_type: "label_flip"
    intensity: 0.2
    target_clients: [0, 1]

orchestration:
  num_clients: 5
  batch_size: 2
  max_memory_mb: 4000
  spawn_delay: 1.5
  client_timeout_seconds: 300

model:
  name: "MNISTNet"
  input_shape: [28, 28, 1]

data:
  dataset: "MNIST"
  num_classes: 10
  batch_size: 32
  train_split: 0.8
  alpha: 0.5

client_config:
  local_epochs: 1
  learning_rate: 0.001
  optimizer: "SGD"
