# Parallel experiment B - runs simultaneously with parallel_a
experiment:
  experiment_name: "baseline_50_clients_parallel_b"
  seed: 456  # Different seed for different initialization
  num_rounds: 50
  min_clients: 10
  min_available_clients: 10
  server_address: "localhost:8081"  # Different port

defence:
  strategy: "none"
  anomaly_threshold: 0.0
  reputation_decay: 0.0
  history_size: 0

attacks: []

orchestration:
  num_clients: 50
  batch_size: 2
  max_memory_mb: 3000
  spawn_delay: 2.0

simulation:
  client_resources:
    num_cpus: 0.25
  ray_init_args:
    include_dashboard: false
    log_to_driver: false
    num_cpus: 4

evaluation:
  num_test_samples: 5000
