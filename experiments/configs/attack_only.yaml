# experiments/configs/attack_only.yaml
experiment:
  experiment_name: "attack_only_no_defence"
  seed: 42
  num_rounds: 10
  min_clients: 2
  min_available_clients: 2
  server_address: "140.245.224.116:8080"

defence:
  strategy: "none"
  anomaly_threshold: 0.0
  reputation_decay: 0.0
  history_size: 0

attacks:
  - enabled: true
    attack_type: "label_flip"
    intensity: 0.1
    target_clients: [0, 1, 2]  # First 3 clients will be malicious
  
  - enabled: true
    attack_type: "gradient_noise"
    intensity: 0.05
    target_clients: [7, 8]  # Clients 7 and 8 with gradient noise

orchestration:
  num_clients: 10
  batch_size: 2  # Spawn 2 clients at a time
  max_memory_mb: 6000
  spawn_delay: 2.0