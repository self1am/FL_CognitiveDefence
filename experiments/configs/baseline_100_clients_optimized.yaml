# Optimized baseline with 100 clients for 64GB RAM, 8 vCPUs
# This configuration is tuned to reduce memory usage and prevent OOM kills

experiment:
  experiment_name: "baseline_100_clients_optimized"
  seed: 123
  num_rounds: 10
  min_clients: 20  # Reduced from 100 to train in batches
  min_available_clients: 20
  server_address: "localhost:8080"

defence:
  strategy: "none"
  anomaly_threshold: 0.0
  reputation_decay: 0.0
  history_size: 0

attacks: []

orchestration:
  num_clients: 100
  batch_size: 2
  max_memory_mb: 4000  # Reduced from 6000 to prevent OOM
  spawn_delay: 2.0

# Flower simulation settings (Ray) - OPTIMIZED
simulation:
  client_resources:
    num_cpus: 0.5  # Keep 0.5 CPU per client
    num_gpus: 0.0
  ray_init_args:
    include_dashboard: false
    log_to_driver: false
    num_cpus: 8
    object_store_memory: 10000000000  # 10GB for Ray object store
    _memory: 50000000000  # 50GB total for Ray (leave ~14GB for system)
    _system_config:
      automatic_object_spilling_enabled: true  # Enable spilling to disk
      object_spilling_config: '{"type":"filesystem","params":{"directory_path":"/tmp/ray_spill"}}'
