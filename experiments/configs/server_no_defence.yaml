# experiments/configs/server_no_defence.yaml
# Configuration to run ONLY the server without any defence (for VM)
experiment:
  experiment_name: "server_only_no_defence_mode"
  seed: 42
  num_rounds: 10
  min_clients: 4
  min_available_clients: 4
  server_address: "0.0.0.0:8080"  # Listen on all interfaces

defense:
  strategy: "none"
  anomaly_threshold: 0.0
  reputation_decay: 0.0
  history_size: 0

# No orchestration section - server only
server_only: true