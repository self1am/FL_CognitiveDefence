# experiments/configs/vert_defence_test.yaml
# Test configuration for VERT defence strategy
experiment:
  experiment_name: "vert_defence_test"
  seed: 42
  num_rounds: 10
  min_clients: 5
  min_available_clients: 5
  server_address: "0.0.0.0:8080"

defence:
  strategy: "vert"
  kappa: 5  # Select top-5 clients with highest similarity
  history_size: 10  # Keep 10 rounds of historical gradients
  projection_dim: 100  # Project gradients to 100-dimensional space
  learning_rate: 0.01  # Learning rate for predictor training
  min_history_rounds: 3  # Minimum rounds before VERT activates

attacks:
  - enabled: true
    attack_type: "label_flip"
    intensity: 0.1
    target_clients: [0, 1]  # First 2 clients are malicious
  
  - enabled: true
    attack_type: "gradient_noise"
    intensity: 0.05
    target_clients: [7]  # Client 7 with gradient noise

orchestration:
  num_clients: 10
  batch_size: 2
  max_memory_mb: 6000
  spawn_delay: 2.0
